<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Asistencia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <meta http-equiv="refresh" content="0; url=https://asistencia.cristianlopezvalpo.workers.dev/">
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Registro de Asistencia</h1>
      <p>Redirigiendo al formulario compartido...</p>
    </header>
    <section class="card qr-card">
      <div class="card-header">
        <h2>Escanea el QR para acceder</h2>
        <p class="qr-subtitle">https://asistencia.cristianlopezvalpo.workers.dev/</p>
      </div>
      <div class="qr-wrapper">
        <img id="qrImg" alt="QR" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https%3A%2F%2Fasistencia.cristianlopezvalpo.workers.dev%2F" />
      </div>
      <p class="qr-help">La aplicación corre en Cloudflare Workers. Los datos se guardan en D1 (compartido para toda la clase).</p>
    </section>
  </main>
  <footer class="footer"><small>Si no redirige automáticamente, <a href="https://asistencia.cristianlopezvalpo.workers.dev/" style="color:var(--primary);">haz clic aquí</a>.</small></footer>
</body>
</html>
